<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Fly Control settings screen preview</title>
  <desc id="desc">Illustrative monochrome mockup of the documented primary design's settings menu with Interval selected.</desc>
  <rect x="8" y="8" width="624" height="384" rx="28" fill="#292d32" stroke="#737982" stroke-width="4"/>
  <rect x="30" y="30" width="580" height="340" rx="18" fill="#171a1e" stroke="#08090b" stroke-width="3"/>
  <circle cx="22" cy="22" r="5" fill="#8c929a"/><circle cx="618" cy="22" r="5" fill="#8c929a"/>
  <circle cx="22" cy="378" r="5" fill="#8c929a"/><circle cx="618" cy="378" r="5" fill="#8c929a"/>
  <rect x="64" y="72" width="512" height="256" fill="#020303" stroke="#9ba1a8" stroke-width="2"/>
  <g transform="translate(64 72) scale(4)" font-family="Arial, sans-serif">
    <g fill="#f1f2ed"><text x="0" y="10" font-size="8">SETTINGS</text><text x="78" y="9" font-size="6">BETA</text></g>
    <path d="M0 13H128" stroke="#f1f2ed" stroke-width="0.6"/>
    <g fill="#f1f2ed"><text x="2" y="29" font-size="10">Display-</text><text x="64" y="29" font-size="7">Simple</text></g>
    <g fill="#f1f2ed"><text x="2" y="45" font-size="10">Mode</text><text x="84" y="45" font-size="7">AUTO</text></g>
    <rect x="0" y="48" width="128" height="15" fill="#f1f2ed"/>
    <g fill="#020303"><text x="2" y="61" font-size="10">Interval</text><text x="84" y="61" font-size="7">6h 00m</text></g>
  </g>
</svg>
