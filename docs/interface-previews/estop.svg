<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Fly Control emergency stop screen preview</title>
  <desc id="desc">Illustrative monochrome mockup of the documented primary design's latched E-stop screen while the normally closed circuit is open.</desc>
  <rect x="8" y="8" width="624" height="384" rx="28" fill="#292d32" stroke="#737982" stroke-width="4"/>
  <rect x="30" y="30" width="580" height="340" rx="18" fill="#171a1e" stroke="#08090b" stroke-width="3"/>
  <circle cx="22" cy="22" r="5" fill="#8c929a"/><circle cx="618" cy="22" r="5" fill="#8c929a"/>
  <circle cx="22" cy="378" r="5" fill="#8c929a"/><circle cx="618" cy="378" r="5" fill="#8c929a"/>
  <rect x="64" y="72" width="512" height="256" fill="#020303" stroke="#9ba1a8" stroke-width="2"/>
  <g transform="translate(64 72) scale(4)" fill="#f1f2ed" font-family="Arial, sans-serif">
    <text x="0" y="10" font-size="7">------------------------------</text>
    <path d="M0 13H128" stroke="#f1f2ed" stroke-width="0.6"/>
    <text x="12" y="37" font-size="18">E-STOP</text>
    <text x="0" y="51" font-size="7">Reset switch</text>
    <text x="0" y="62" font-size="6">Then click the encoder</text>
  </g>
</svg>
